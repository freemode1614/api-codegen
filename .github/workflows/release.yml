name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish with npm, not `changeset publish`: changesets detects pnpm
      # and spawns `pnpm publish --json`, which uploaded the tarball fine but
      # then failed to parse its own JSON output ("ELIFECYCLE undefined").
      # changesets treated that as a failure and retried, so the retry hit
      # its own upload and died with E409 — a red run for a publish that had
      # actually succeeded. `npm publish` exits 0 on success and never
      # publishes twice on its own.
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@moccona/apicodegen@${version}" version >/dev/null 2>&1; then
            echo "::notice::@moccona/apicodegen@${version} is already on the registry, skipping"
            exit 0
          fi
          echo "Publishing @moccona/apicodegen@${version}"
          npm publish --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
