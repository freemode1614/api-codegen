name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish with npm, not `changeset publish`: changesets detects pnpm
      # and spawns `pnpm publish --json`, which uploaded the tarball fine but
      # then failed to parse its own JSON output ("ELIFECYCLE undefined").
      # changesets treated that as a failure and retried, so the retry hit
      # its own upload and died with E409 — a red run for a publish that had
      # actually succeeded. `npm publish` exits 0 on success and never
      # publishes twice on its own.
      - name: Publish to npm
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          if npm view "@moccona/apicodegen@${pkg_version}" version >/dev/null 2>&1; then
            echo "::notice::@moccona/apicodegen@${pkg_version} is already on the registry, skipping"
            exit 0
          fi
          echo "Publishing @moccona/apicodegen@${pkg_version}"
          npm publish --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
